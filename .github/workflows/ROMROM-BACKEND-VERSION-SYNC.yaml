# ===================================================================
# 백엔드 플랫폼별 최신 버전 동기화 워크플로우
# ===================================================================
#
# 스토어 출시(또는 심사 등록) 확인 후 백엔드 최신 버전을 플랫폼별로 갱신합니다.
# TestFlight·내부 테스트 업로드 시점에는 갱신하지 않습니다 (출시 전 권장 업데이트 안내 방지).
#
# 갱신 시점 (#1004)
#   - Android: ROMROM-ANDROID-PLAYSTORE-CICD 프로덕션 심사 등록(store_submit) 성공 후 workflow_call
#              (Play API로는 심사 통과 여부를 알 수 없어 등록 시점 사용, 심사 중 몇 시간은 안내가 먼저 나갈 수 있음)
#   - iOS: 6시간마다 App Store 공개 조회(iTunes Lookup)로 실제 출시 버전 확인 > 서버 값과 다를 때만 갱신
#   - 수동: workflow_dispatch (platform 선택, version 비우면 iOS = 스토어 조회 / Android = deploy 브랜치 version.yml)
#
# 백엔드 공통 최신 버전(구버전 앱용 latestVersion) = 두 플랫폼 중 낮은 버전 (서버 계산)
# @SecuredApi (HMAC-SHA256 + Timestamp) 보안 적용
# 관련 이슈: https://github.com/TEAM-ROMROM/RomRom-FE/issues/680, #1004
#
# ===================================================================

name: ROMROM-BACKEND-VERSION-SYNC

on:
  # Android 프로덕션 심사 등록 성공 후 (ROMROM-ANDROID-PLAYSTORE-CICD)
  workflow_call:
    inputs:
      platform:
        description: "ios | android"
        required: true
        type: string
      version:
        description: "동기화할 버전 (비우면 iOS 스토어 조회 / Android version.yml)"
        required: false
        type: string
        default: ""

  # iOS App Store 출시 버전 정기 확인
  schedule:
    - cron: "0 */6 * * *"

  # 수동 실행
  workflow_dispatch:
    inputs:
      platform:
        description: "동기화할 플랫폼"
        required: true
        default: "ios"
        type: choice
        options:
          - ios
          - android
      version:
        description: "버전 (비우면 iOS = App Store 조회, Android = deploy 브랜치 version.yml)"
        required: false
        default: ""
        type: string

env:
  BACKEND_API_URL: "https://api.romrom.suhsaechan.kr"
  PROJECT_TYPE: "flutter"
  IOS_BUNDLE_ID: "com.alom.romrom"
  IOS_STORE_COUNTRY: "kr"

jobs:
  sync-version:
    name: 백엔드 플랫폼별 최신 버전 동기화
    runs-on: ubuntu-latest

    # 플랫폼별 직렬화 (iOS 정기 확인이 Android 동기화를 취소하지 않게)
    concurrency:
      group: backend-version-sync-${{ inputs.platform || 'ios' }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: deploy
          fetch-depth: 1

      # 플랫폼·버전 결정 (schedule = iOS)
      - name: 동기화 대상 결정
        id: target
        run: |
          PLATFORM="${{ inputs.platform || 'ios' }}"
          VERSION="${{ inputs.version }}"

          if [ -z "$VERSION" ] && [ "$PLATFORM" = "ios" ]; then
            # App Store 공개 조회: 실제 출시(심사 통과·공개)된 버전만 반환
            VERSION=$(curl -s "https://itunes.apple.com/lookup?bundleId=${{ env.IOS_BUNDLE_ID }}&country=${{ env.IOS_STORE_COUNTRY }}" \
              | jq -r '.results[0].version // empty')
            echo "🍎 App Store 출시 버전: ${VERSION:-없음}"
          fi

          if [ -z "$VERSION" ] && [ "$PLATFORM" = "android" ]; then
            VERSION=$(grep '^version:' version.yml | sed 's/version: *"\(.*\)"/\1/')
            echo "🤖 version.yml 버전: $VERSION"
          fi

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ 동기화할 버전을 확인하지 못했습니다: platform=$PLATFORM, version=$VERSION"
            exit 1
          fi

          echo "platform=$PLATFORM" >> $GITHUB_OUTPUT
          echo "platform_upper=$(echo "$PLATFORM" | tr '[:lower:]' '[:upper:]')" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # HMAC-SHA256 서명 > 현재 서버 값과 같으면 생략 > 플랫폼 지정 갱신
      - name: 백엔드 플랫폼 최신 버전 갱신
        env:
          SECURED_API_SECRET_KEY: ${{ secrets.WEB_SMB_PASSWORD }}
        run: |
          PLATFORM="${{ steps.target.outputs.platform }}"
          PLATFORM_UPPER="${{ steps.target.outputs.platform_upper }}"
          VERSION="${{ steps.target.outputs.version }}"

          sign_headers() {
            TIMESTAMP=$(date +%s%3N)
            SIGNATURE=$(echo -n "$TIMESTAMP" | openssl dgst -sha256 -hmac "$SECURED_API_SECRET_KEY" | awk '{print $2}')
          }

          # 현재 서버 플랫폼 최신 버전 (같으면 갱신 생략)
          sign_headers
          CURRENT_VERSION=$(curl -s -X POST "${{ env.BACKEND_API_URL }}/api/app/version/check" \
            -H "X-Timestamp: $TIMESTAMP" \
            -H "X-Signature: $SIGNATURE" \
            | jq -r "if \"$PLATFORM\" == \"ios\" then .latestVersionIos else .latestVersionAndroid end // empty")
          echo "📡 서버 현재 $PLATFORM 최신 버전: ${CURRENT_VERSION:-없음}"
          if [ "$CURRENT_VERSION" = "$VERSION" ]; then
            echo "✅ 이미 최신 ($VERSION) > 갱신 생략"
            exit 0
          fi

          echo "=========================================="
          echo "🔄 백엔드 최신 버전 동기화"
          echo "📱 플랫폼: $PLATFORM_UPPER"
          echo "📦 버전: $VERSION"
          echo "=========================================="

          sign_headers
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -X POST "${{ env.BACKEND_API_URL }}/api/app/version/update" \
            -H "X-Timestamp: $TIMESTAMP" \
            -H "X-Signature: $SIGNATURE" \
            -F "version=$VERSION" \
            -F "platform=$PLATFORM_UPPER")

          RESPONSE=$(cat response.json)
          echo "📡 HTTP Status: $HTTP_STATUS"
          echo "📄 Response: $RESPONSE"

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ 동기화 성공"
            echo "📦 latestVersion(공통): $(echo $RESPONSE | jq -r '.latestVersion // "N/A"')"
            echo "📦 latestVersionIos: $(echo $RESPONSE | jq -r '.latestVersionIos // "N/A"')"
            echo "📦 latestVersionAndroid: $(echo $RESPONSE | jq -r '.latestVersionAndroid // "N/A"')"
          else
            echo "❌ 동기화 실패 (HTTP $HTTP_STATUS)"
            exit 1
          fi

      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ 백엔드 버전 동기화 실패!"
          echo "트리거: ${{ github.event_name }}, 플랫폼: ${{ inputs.platform || 'ios' }}"
          echo "로그를 확인해주세요."
